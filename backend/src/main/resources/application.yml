spring:
  application:
    name: shiftpilot
  datasource:
    url: jdbc:postgresql://localhost:5432/shiftpilot
    username: shiftpilot
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true

