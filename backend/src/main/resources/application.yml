spring:
  application:
    name: shiftpilot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shiftpilot}
    username: ${SPRING_DATASOURCE_USERNAME:shiftpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:49454E856F28564F42576A5E315234364448373147414A51445A48395A6D5645}
  expiration: 86400000 # 24 hours for demo purposes
  refresh-expiration: 604800000 # 7 days

